<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jia's Castle</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --pink: #FFD1DC; --yellow: #FFF9C4; --blue: #B3E5FC; --black: #000000; --white: #FFFFFF; --green: #C8E6C9; }
        body { font-family: 'Inter', sans-serif; background: #fdfdfd; margin: 0; padding: 10px; display: flex; justify-content: center; }
        .app-container { max-width: 550px; width: 100%; background: var(--white); border: 4px solid var(--black); box-shadow: 10px 10px 0px var(--black); border-radius: 25px; padding: 20px; min-height: 95vh; }
        
        header { text-align: center; margin-bottom: 20px; }
        .main-hero { width: 100%; max-width: 320px; margin: 0 auto 10px; display: block; border-radius: 15px; }
        .back-btn { display: none; cursor: pointer; font-weight: bold; background: var(--yellow); padding: 8px 15px; border: 3px solid black; border-radius: 20px; margin-bottom: 15px; width: fit-content; }
        .page { display: none; }
        .active-page { display: block; }

        /* Dashboard */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .nav-card { background: white; border: 3px solid var(--black); border-radius: 20px; padding: 5px; cursor: pointer; }
        .nav-card img { width: 100%; display: block; border-radius: 15px; }

        /* Calendar */
        
        .toolbox { display: flex; flex-wrap: wrap; gap: 5px; background: #fafafa; padding: 12px; border: 3px solid black; border-radius: 15px; margin-bottom: 15px; position: sticky; top: 0; z-index: 100; box-shadow: 4px 4px 0px black; }
        .pill { padding: 4px 8px; border-radius: 10px; border: 2px solid black; font-weight: bold; font-size: 0.55rem; cursor: grab; background: white; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 2px solid black; border-left: 2px solid black; }
        .day { min-height: 75px; border-right: 2px solid black; border-bottom: 2px solid black; padding: 4px; font-size: 0.6rem; background: white; }
        .day .pill { display: block; margin-top: 2px; font-size: 0.5rem; text-align: center; cursor: pointer; }

        /* General UI */
        .input-box { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid black; border-radius: 12px; font-weight: bold; box-sizing: border-box; }
        .action-btn { background: var(--pink); cursor: pointer; font-weight: bold; border: 2px solid black; border-radius: 12px; padding: 12px; width: 100%; }
        .item-card { background: #fff; border: 2px solid black; padding: 15px; border-radius: 15px; margin-bottom: 10px; }
        .tag { font-size: 0.6rem; padding: 2px 6px; border: 1px solid black; border-radius: 8px; font-weight: bold; margin-right: 5px; background: var(--yellow); }
    </style>
</head>
<body>

<div class="app-container">
    <div id="backNav" class="back-btn" onclick="showPage('home')">← Dashboard</div>
    <header id="mainHeader"><img src="main-logo.jpeg" class="main-hero"></header>

    <div id="homePage" class="page active-page">
        <div class="dashboard-grid">
            <div class="nav-card" onclick="showPage('calendar')"><img src="icon-calender.png"></div>
            <div class="nav-card" onclick="showPage('guests')"><img src="icon-guest.png"></div>
            <div class="nav-card" onclick="showPage('inspo')"><img src="icon-inspo.png"></div>
            <div class="nav-card" onclick="showPage('look')"><img src="icon-thelook.png"></div>
            <div class="nav-card" onclick="showPage('vendors')"><img src="icon-vendors.png"></div>
            <div class="nav-card" onclick="showPage('creator')"><img src="icon-creator.png"></div>
            <div class="nav-card" onclick="showPage('money')"><img src="icon-money.png"></div>
            <div class="nav-card" onclick="showPage('photos')"><img src="icon-photos.png"></div>
        </div>
    </div>

    <div id="calendarPage" class="page">
        <div class="custom-pill-creator" style="background: #fafafa; border: 2px dashed black; padding: 10px; border-radius: 15px; margin-bottom: 15px;">
    <div style="display: flex; gap: 5px; margin-bottom: 5px;">
        <input type="text" id="newPillText" class="input-box" placeholder="New task (e.g. Cake Pickup)" style="flex: 1;">
        <button onclick="createNewPill()" style="padding: 5px 15px; border: 2px solid black; border-radius: 10px; background: var(--blue); font-weight: bold; cursor: pointer;">+</button>
    </div>
    <div style="display: flex; gap: 8px; align-items: center; font-size: 0.8rem; font-weight: bold;">
        <span>Color:</span>
        <div onclick="selectColor('var(--pink)')" style="width:20px; height:20px; border-radius:50%; border:1px solid black; cursor:pointer; background:var(--pink)"></div>
        <div onclick="selectColor('var(--yellow)')" style="width:20px; height:20px; border-radius:50%; border:1px solid black; cursor:pointer; background:var(--yellow)"></div>
        <div onclick="selectColor('var(--blue)')" style="width:20px; height:20px; border-radius:50%; border:1px solid black; cursor:pointer; background:var(--blue)"></div>
        <div onclick="selectColor('var(--green)')" style="width:20px; height:20px; border-radius:50%; border:1px solid black; cursor:pointer; background:var(--green)"></div>
        <div onclick="selectColor('var(--cream)')" style="width:20px; height:20px; border-radius:50%; border:1px solid black; cursor:pointer; background:var(--cream)"></div>
    </div>
</div>
        <div class="toolbox">
            <div class="pill" style="background:var(--pink)" draggable="true" ondragstart="drag(event)" id="c1">💍 Marriage Reg</div>
            <div class="pill" style="background:var(--pink)" draggable="true" ondragstart="drag(event)" id="c2">💐 Bouquet</div>
            <div class="pill" style="background:var(--blue)" draggable="true" ondragstart="drag(event)" id="c3">🚢 Ship Decor</div>
            <div class="pill" style="background:var(--blue)" draggable="true" ondragstart="drag(event)" id="c4">🧲 Ship Magnets</div>
            <div class="pill" style="background:var(--yellow)" draggable="true" ondragstart="drag(event)" id="c5">📜 Vows</div>
            <div class="pill" style="background:var(--pink)" draggable="true" ondragstart="drag(event)" id="c6">📸 Pre-Wed</div>
            <div class="pill" style="background:var(--green)" draggable="true" ondragstart="drag(event)" id="c7">🥗 Diet</div>
            <div class="pill" style="background:var(--green)" draggable="true" ondragstart="drag(event)" id="c8">💆 Massage</div>
            <div class="pill" style="background:var(--yellow)" draggable="true" ondragstart="drag(event)" id="c9">✈️ Osaka/HM Flights</div>
            <div class="pill" style="background:var(--yellow)" draggable="true" ondragstart="drag(event)" id="c10">🏨 Osaka/HM Hotels</div>
            <div class="pill" style="background:var(--blue)" draggable="true" ondragstart="drag(event)" id="c11">🇯🇵 Osaka Trip</div>
            <div class="pill" style="background:var(--blue)" draggable="true" ondragstart="drag(event)" id="c12">🏝️ Honeymoon</div>
        </div>
        <div id="calendarContainer" style="max-height: 60vh; overflow-y: auto;"></div>
    </div>

    <div id="guestsPage" class="page">
        <input type="text" id="gName" class="input-box" placeholder="Guest Name">
        <select id="gLoc" class="input-box" onchange="toggleGuestFields()">
            <option value="Seoul">Seoul Wedding (May)</option>
            <option value="KL">KL Wedding (Sept)</option>
        </select>
        <div id="seoulFields"><label><input type="checkbox" id="gBus"> 🚌 Transport Arrangement?</label></div>
        <div id="klFields" style="display:none;"><input type="text" id="gTable" class="input-box" placeholder="Table Name/Number"></div>
        <button class="action-btn" onclick="addGuest()">Add to List</button>
        <div id="guestDisplay" style="margin-top:20px;"></div>
    </div>

    <div id="creatorPage" class="page">
        <div class="item-card">
            <h3>🎥 Content Pipeline</h3>
            <input type="text" id="vTitle" class="input-box" placeholder="Video Title">
            <select id="vStatus" class="input-box">
                <option value="FILMING">🎥 To Film</option>
                <option value="EDITING">✂️ To Edit</option>
                <option value="POSTING">🚀 To Upload</option>
            </select>
            <button class="action-btn" onclick="addTask()">Save Task</button>
        </div>
        <div class="item-card">
            <h3>✨ Reel Inspiration</h3>
            <input type="text" id="vReel" class="input-box" placeholder="Paste IG Reel URL">
            <button class="action-btn" style="background:var(--blue)" onclick="addInspo()">Add Inspo</button>
        </div>
        <div id="creatorFeed"></div>
    </div>

    <div id="moneyPage" class="page">
        <div class="item-card" style="background:var(--yellow)">
            <input type="number" id="budgetIn" class="input-box" placeholder="Set Overall Budget" oninput="updateBudget()">
            <p><strong>Leftover:</strong> <span id="budgetBal">0</span></p>
        </div>
        <input type="text" id="eN" class="input-box" placeholder="Item Name"><input type="number" id="eA" class="input-box" placeholder="Amount">
        <button class="action-btn" onclick="addExp()">Add Expense</button>
        <div id="eList"></div>
    </div>
</div>

<script>
    function showPage(pId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        document.getElementById(pId + 'Page').classList.add('active-page');
        document.getElementById('backNav').style.display = pId==='home' ? 'none' : 'block';
        document.getElementById('mainHeader').style.display = pId==='home' ? 'block' : 'none';
    }

    // CALENDAR
    const months = ["December 2025", "January 2026", "February 2026", "March 2026", "April 2026", "May 2026", "June 2026", "July 2026", "August 2026", "September 2026", "October 2026"];
    months.forEach(m => {
        let h = `<div style="background:var(--blue); padding:5px; border:2px solid black; border-radius:10px; text-align:center; margin-top:15px; font-weight:bold;">${m}</div>`;
        h += `<div style="display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:0.5rem; font-weight:bold; margin:5px 0;"><div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div></div><div class="calendar-grid">`;
        for(let i=1; i<=31; i++) h += `<div class="day" ondrop="drop(event)" ondragover="allowDrop(event)"><strong>${i}</strong></div>`;
        document.getElementById('calendarContainer').innerHTML += h + `</div>`;
    });
    function allowDrop(e) { e.preventDefault(); }
    function drag(e) { e.dataTransfer.setData("text", e.target.id); }
    function drop(e) {
        e.preventDefault();
        const node = document.getElementById(e.dataTransfer.getData("text")).cloneNode(true);
        node.ondblclick = function() { this.remove(); };
        e.currentTarget.appendChild(node);
    }

    // GUESTS
    function toggleGuestFields() {
        const l = document.getElementById('gLoc').value;
        document.getElementById('seoulFields').style.display = l==='Seoul' ? 'block' : 'none';
        document.getElementById('klFields').style.display = l==='KL' ? 'block' : 'none';
    }
    function addGuest() {
        const n = document.getElementById('gName').value, l = document.getElementById('gLoc').value;
        const extra = l==='Seoul' ? (document.getElementById('gBus').checked ? " (🚌 Bus Needed)" : "") : " (🪑 Table: "+document.getElementById('gTable').value+")";
        document.getElementById('guestDisplay').innerHTML += `<div class="item-card"><b>${n}</b> <span class="tag">${l}</span> ${extra}</div>`;
    }

    // CREATOR
    function addTask() {
        const t = document.getElementById('vTitle').value, s = document.getElementById('vStatus').value;
        document.getElementById('creatorFeed').innerHTML += `<div class="item-card"><span class="tag">${s}</span> ${t}</div>`;
    }
    function addInspo() {
        const r = document.getElementById('vReel').value;
        document.getElementById('creatorFeed').innerHTML += `<div class="item-card"><iframe src="${r.split('?')[0]}embed/" width="100%" height="300" frameborder="0"></iframe></div>`;
    }

    // MONEY
    let total = 0;
    function addExp() {
        const n = document.getElementById('eN').value, a = parseFloat(document.getElementById('eA').value);
        total += a; document.getElementById('eList').innerHTML += `<div class="item-card"><b>${n}</b>: ${a.toLocaleString()}</div>`;
        updateBudget();
    }
    function updateBudget() {
        const b = parseFloat(document.getElementById('budgetIn').value) || 0;
        document.getElementById('budgetBal').innerText = (b - total).toLocaleString();
    }
    let selectedPillColor = 'white'; // Default color

function selectColor(color) {
    selectedPillColor = color;
    // Visually show the selected color in the input box
    document.getElementById('newPillText').style.border = '3px solid ' + color;
}

function createNewPill() {
    const text = document.getElementById('newPillText').value;
    if (!text) return;

    const newPill = document.createElement('div');
    newPill.className = 'pill';
    newPill.style.backgroundColor = selectedPillColor;
    newPill.draggable = true;
    newPill.id = 'custom-' + Date.now(); // Unique ID
    newPill.innerText = text;
    
    // Attach the drag event
    newPill.ondragstart = drag;

    // Add it to the top of your existing toolbox
    // Ensure your toolbox has id="pillToolbox" or change the line below to match your toolbox class/id
    document.querySelector('.toolbox').prepend(newPill);
    
    // Reset input
    document.getElementById('newPillText').value = "";
    document.getElementById('newPillText').style.border = '2px solid black';
}
</script>
</body>
</html>
