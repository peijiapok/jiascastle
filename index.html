<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jia's Castle</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #FFD1DC; --yellow: #FFF9C4; --blue: #B3E5FC;
            --black: #000000; --white: #FFFFFF; --cream: #F5E6CC;
        }

        body { font-family: 'Inter', sans-serif; background: #fdfdfd; margin: 0; padding: 10px; display: flex; justify-content: center; }
        .app-container { max-width: 500px; width: 100%; background: var(--white); border: 4px solid var(--black); box-shadow: 10px 10px 0px var(--black); border-radius: 25px; padding: 20px; min-height: 95vh; overflow: hidden; position: relative; }

        header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .dashboard-hero { width: 100%; max-width: 320px; display: block; margin: 0 auto 10px; border-radius: 15px; }
        h1 { font-family: 'Playfair Display', serif; font-style: italic; font-size: 2.2rem; margin: 0; }
        
        .back-btn { display: none; cursor: pointer; font-weight: bold; background: var(--yellow); padding: 8px 20px; border: 3px solid black; border-radius: 20px; margin-bottom: 15px; width: fit-content; position: relative; z-index: 1000; }

        .countdown-strip { background: var(--white); border: 3px solid var(--black); border-radius: 15px; padding: 10px; font-size: 0.8rem; font-weight: bold; text-align: center; margin-bottom: 15px; display: flex; justify-content: space-around; }

        /* Dashboard Navigation Grid */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .nav-card { 
            background: white; border: 3px solid var(--black); border-radius: 20px; padding: 5px; 
            text-align: center; cursor: pointer; transition: 0.2s; overflow: hidden;
        }
        .nav-card:hover { transform: translate(-3px, -3px); box-shadow: 5px 5px 0px var(--black); }
        .nav-card img { width: 100%; display: block; }

        /* Creator Scratchpad Styles */
        .creator-input { width: 100%; box-sizing: border-box; border: 2px solid black; border-radius: 12px; padding: 12px; font-family: inherit; margin-bottom: 10px; }
        .creator-btn { background: var(--pink); font-weight: bold; padding: 10px; border: 2px solid black; border-radius: 10px; cursor: pointer; width: 100%; }
        .note-card { background: #fafafa; border: 2px solid black; border-radius: 15px; padding: 15px; margin-top: 15px; position: relative; }
        .note-tag { display: inline-block; padding: 2px 8px; border: 1px solid black; border-radius: 20px; font-size: 0.7rem; font-weight: bold; margin-bottom: 8px; background: var(--yellow); }
        .note-content { font-size: 0.9rem; white-space: pre-wrap; }
        .delete-note { position: absolute; top: 10px; right: 10px; cursor: pointer; color: #ff6b6b; font-weight: bold; }

        /* General Page/Animation */
        .page { display: none; animation: fadeIn 0.3s ease; }
        .active-page { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Calendar (Minimized for space) */
        #calendarPage { max-height: 75vh; overflow-y: auto; }
        .month-title { font-family: 'Playfair Display', serif; font-size: 1.2rem; background: var(--blue); padding: 5px; border: 2px solid black; border-radius: 10px; margin-bottom: 8px; text-align: center; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid black; border-left: 1px solid black; margin-bottom: 20px; }
        .day { min-height: 50px; border-right: 1px solid black; border-bottom: 1px solid black; padding: 4px; font-size: 0.7rem; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="backNav" class="back-btn" onclick="showPage('home')">← Dashboard</div>
    
    <header id="mainHeader">
        <img src="jia_locked_in_castle.png" alt="Hero Logo" class="dashboard-hero">
        <div class="countdown-strip">
            <div>🇰🇷 <span id="daysKorea">--</span>d</div>
            <div>🇲🇾 <span id="daysKL">--</span>d</div>
        </div>
    </header>

    <div id="homePage" class="page active-page">
        <div class="dashboard-grid">
            <div class="nav-card" onclick="showPage('calendar')"><img src="icon-calender.png"></div>
            <div class="nav-card" onclick="showPage('guests')"><img src="icon-guest.png"></div>
            <div class="nav-card" onclick="showPage('inspo')"><img src="icon-inspo.png"></div>
            <div class="nav-card" onclick="showPage('look')"><img src="icon-thelook.png"></div>
            <div class="nav-card" onclick="showPage('vendors')"><img src="icon-vendors.png"></div>
            <div class="nav-card" onclick="showPage('creator')"><img src="icon-creator.png"></div>
            <div class="nav-card" onclick="showPage('money')"><img src="icon-money.png"></div>
            <div class="nav-card" onclick="showPage('photos')"><img src="icon-photos.png"></div>
        </div>
    </div>

    <div id="creatorPage" class="page">
        <select id="contentStatus" class="creator-input">
            <option value="IDEA">💡 New Idea</option>
            <option value="FILMING">🎬 Currently Filming</option>
            <option value="EDITING">✂️ Editing</option>
            <option value="POSTED">📱 Published</option>
        </select>
        <textarea id="creatorNote" class="creator-input" rows="4" placeholder="Script idea, vlog title, or caption..."></textarea>
        <button class="creator-btn" onclick="addNote()">Save Content Note</button>
        
        <div id="notesContainer"></div>
    </div>

    <div id="calendarPage" class="page"><div id="calendarContainer"></div></div>

    <div id="moneyPage" class="page"><h3>Money Tracker</h3></div>
    <div id="guestsPage" class="page"><h3>Guest List</h3></div>
    <div id="inspoPage" class="page"><h3>Inspo Moodboard</h3></div>
    <div id="lookPage" class="page"><h3>The Look</h3></div>
    <div id="vendorsPage" class="page"><h3>Vendors</h3></div>
    <div id="photosPage" class="page"><h3>Photos</h3></div>
</div>

<script>
    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        document.getElementById(pageId + 'Page').classList.add('active-page');
        const isHome = pageId === 'home';
        document.getElementById('backNav').style.display = isHome ? 'none' : 'block';
        document.getElementById('mainHeader').style.display = isHome ? 'block' : 'none';
        window.scrollTo(0,0);
    }

    // Creator Note Logic
    function addNote() {
        const text = document.getElementById('creatorNote').value;
        const status = document.getElementById('contentStatus').value;
        if (!text) return;

        const note = document.createElement('div');
        note.className = 'note-card';
        note.innerHTML = `
            <span class="delete-note" onclick="this.parentElement.remove()">×</span>
            <div class="note-tag">${status}</div>
            <div class="note-content">${text}</div>
        `;
        document.getElementById('notesContainer').prepend(note);
        document.getElementById('creatorNote').value = "";
    }

    // Calendar Generation
    const months = [
        { name: "December 2025", days: 31 }, { name: "January 2026", days: 31 },
        { name: "February 2026", days: 28 }, { name: "March 2026", days: 31 },
        { name: "April 2026", days: 30 }, { name: "May 2026", days: 31 },
        { name: "June 2026", days: 30 }, { name: "July 2026", days: 31 },
        { name: "August 2026", days: 31 }, { name: "September 2026", days: 30 },
        { name: "October 2026", days: 31 }
    ];
    const container = document.getElementById('calendarContainer');
    months.forEach(m => {
        let html = `<div class="month-title">${m.name}</div><div class="calendar-grid">`;
        for (let d = 1; d <= m.days; d++) {
            html += `<div class="day"><strong>${d}</strong></div>`;
        }
        html += `</div>`;
        container.innerHTML += html;
    });

    // Countdown Logic
    const kDate = new Date("May 30, 2026").getTime();
    const klDate = new Date("September 26, 2026").getTime();
    setInterval(() => {
        const now = new Date().getTime();
        document.getElementById('daysKorea').innerText = Math.floor((kDate - now)/(1000*60*60*24));
        document.getElementById('daysKL').innerText = Math.floor((klDate - now)/(1000*60*60*24));
    }, 1000);
</script>

</body>
</html>
