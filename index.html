<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jia's Castle</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --pink: #FFD1DC; --yellow: #FFF9C4; --blue: #B3E5FC; --black: #000000; --white: #FFFFFF; --green: #C8E6C9; --cream: #F5E6CC; }
        body { font-family: 'Inter', sans-serif; background: #fdfdfd; margin: 0; padding: 10px; display: flex; justify-content: center; }
        .app-container { max-width: 550px; width: 100%; background: var(--white); border: 4px solid var(--black); box-shadow: 10px 10px 0px var(--black); border-radius: 25px; padding: 20px; min-height: 95vh; }
        header { text-align: center; margin-bottom: 20px; }
        .main-hero { width: 100%; max-width: 320px; margin: 0 auto 10px; display: block; border-radius: 15px; }
        .back-btn { display: none; cursor: pointer; font-weight: bold; background: var(--yellow); padding: 8px 15px; border: 2px solid black; border-radius: 20px; margin-bottom: 15px; width: fit-content; }
        .page { display: none; }
        .active-page { display: block; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .nav-card { background: white; border: 3px solid var(--black); border-radius: 20px; padding: 5px; cursor: pointer; }
        .nav-card img { width: 100%; display: block; border-radius: 15px; }
        .toolbox { display: flex; flex-wrap: wrap; gap: 5px; background: #fafafa; padding: 12px; border: 3px solid black; border-radius: 15px; margin-bottom: 15px; position: sticky; top: 0; z-index: 100; box-shadow: 4px 4px 0px black; }
        .pill { padding: 4px 8px; border-radius: 10px; border: 2px solid black; font-weight: bold; font-size: 0.55rem; cursor: grab; background: white; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 2px solid black; border-left: 2px solid black; }
        .day { min-height: 75px; border-right: 2px solid black; border-bottom: 2px solid black; padding: 4px; font-size: 0.6rem; background: white; vertical-align: top; }
        .input-box { width: 100%; padding: 10px; border: 2px solid black; border-radius: 10px; font-weight: bold; font-family: inherit; box-sizing: border-box; margin: 5px 0; }
        .action-btn { background: var(--pink); cursor: pointer; font-weight: bold; border: 2px solid black; border-radius: 10px; padding: 10px; width: 100%; }
        .item-card { background: #fff; border: 2px solid black; padding: 15px; border-radius: 15px; margin-bottom: 10px; position: relative; }
        .tag { font-size: 0.6rem; padding: 2px 6px; border: 1px solid black; border-radius: 8px; font-weight: bold; background: var(--yellow); }
    </style>
</head>
<body>

<div class="app-container">
    <div id="backNav" class="back-btn" onclick="showPage('home')">← Dashboard</div>
    <header id="mainHeader"><img src="main-logo.jpeg" class="main-hero"></header>

    <div id="homePage" class="page active-page">
        <div class="dashboard-grid">
            <div class="nav-card" onclick="showPage('calendar')"><img src="icon-calender.png"></div>
            <div class="nav-card" onclick="showPage('guests')"><img src="icon-guest.png"></div>
            <div class="nav-card" onclick="showPage('inspo')"><img src="icon-inspo.png"></div>
            <div class="nav-card" onclick="showPage('look')"><img src="icon-thelook.png"></div>
            <div class="nav-card" onclick="showPage('vendors')"><img src="icon-vendors.png"></div>
            <div class="nav-card" onclick="showPage('creator')"><img src="icon-creator.png"></div>
            <div class="nav-card" onclick="showPage('money')"><img src="icon-money.png"></div>
            <div class="nav-card" onclick="showPage('photos')"><img src="icon-photos.png"></div>
        </div>
    </div>

    <div id="calendarPage" class="page">
        <div style="background: #fafafa; border: 2px dashed black; padding: 10px; border-radius: 15px; margin-bottom: 10px;">
            <input type="text" id="newPillText" class="input-box" placeholder="Create custom pill...">
            <button onclick="createNewPill()" class="action-btn" style="background:var(--blue)">+ Create Pill</button>
        </div>
        <div class="toolbox" id="pillToolbox">
            <div class="pill" style="background:var(--pink)" draggable="true" ondragstart="drag(event)" id="pre1">💍 Marriage Reg</div>
            <div class="pill" style="background:var(--blue)" draggable="true" ondragstart="drag(event)" id="pre2">🚢 Ship Decor</div>
            <div class="pill" style="background:var(--green)" draggable="true" ondragstart="drag(event)" id="pre3">💆 Massage</div>
            <div class="pill" style="background:var(--yellow)" draggable="true" ondragstart="drag(event)" id="pre4">✈️ Flight</div>
        </div>
        <div id="calendarContainer" style="max-height: 55vh; overflow-y: auto;"></div>
    </div>

    <div id="guestsPage" class="page">
        <input type="text" id="gName" class="input-box" placeholder="Name">
        <select id="gLoc" class="input-box" onchange="toggleGuestFields()">
            <option value="Seoul">Seoul Wedding</option>
            <option value="KL">KL Wedding</option>
        </select>
        <div id="seoulFields"><label><input type="checkbox" id="gBus"> 🚌 Needs Transport?</label></div>
        <div id="klFields" style="display:none;"><input type="text" id="gTable" class="input-box" placeholder="Table No."></div>
        <button class="action-btn" onclick="addGuest()">Add Guest</button>
        <div id="guestDisplay"></div>
    </div>

    <div id="moneyPage" class="page">
        <input type="text" id="eN" class="input-box" placeholder="Expense Item">
        <input type="number" id="eA" class="input-box" placeholder="Amount">
        <button class="action-btn" onclick="addExpense()">Add Expense</button>
        <div id="eList"></div>
    </div>

    <div id="creatorPage" class="page">
        <input type="text" id="cTask" class="input-box" placeholder="Video Title (Filming/Editing)">
        <input type="text" id="cReel" class="input-box" placeholder="Inspo IG Reel Link">
        <button class="action-btn" onclick="addCreatorItem()">Add Creator Note</button>
        <div id="cList"></div>
    </div>

    <div id="vendorsPage" class="page">
        <input type="text" id="vN" class="input-box" placeholder="Vendor Name">
        <input type="text" id="vL" class="input-box" placeholder="Vendor Link">
        <button class="action-btn" onclick="addVendor()">Add Vendor</button>
        <div id="vList"></div>
    </div>

    <div id="inspoPage" class="page"><input type="text" id="inU" class="input-box" placeholder="Image Link"><button class="action-btn" onclick="saveMedia('in')">Save</button><div id="inList"></div></div>
    <div id="lookPage" class="page"><input type="text" id="loU" class="input-box" placeholder="Image Link"><button class="action-btn" onclick="saveMedia('lo')">Save</button><div id="loList"></div></div>
    <div id="photosPage" class="page"><input type="text" id="phU" class="input-box" placeholder="Image Link"><button class="action-btn" onclick="saveMedia('ph')">Save</button><div id="phList"></div></div>

</div>

<script>
    let totalSpent = 0;

    // This is the trigger that makes sure the calendar appears!
    window.onload = function() {
        generateCalendar();
        loadAllData();
    };

    function generateCalendar() {
        const months = [
            { name: "August 2025", year: 2025, monthIndex: 7 },
            { name: "September 2025", year: 2025, monthIndex: 8 },
            { name: "October 2025", year: 2025, monthIndex: 9 },
            { name: "November 2025", year: 2025, monthIndex: 10 },
            { name: "December 2025", year: 2025, monthIndex: 11 },
            { name: "January 2026", year: 2026, monthIndex: 0 },
            { name: "February 2026", year: 2026, monthIndex: 1 },
            { name: "March 2026", year: 2026, monthIndex: 2 },
            { name: "April 2026", year: 2026, monthIndex: 3 },
            { name: "May 2026", year: 2026, monthIndex: 4 },
            { name: "June 2026", year: 2026, monthIndex: 5 },
            { name: "July 2026", year: 2026, monthIndex: 6 },
            { name: "August 2026", year: 2026, monthIndex: 7 },
            { name: "September 2026", year: 2026, monthIndex: 8 },
            { name: "October 2026", year: 2026, monthIndex: 9 },
            { name: "November 2026", year: 2026, monthIndex: 10 },
            { name: "December 2026", year: 2026, monthIndex: 11 }
        ];

        const cont = document.getElementById('calendarContainer');
        cont.innerHTML = ""; 

        months.forEach(m => {
            let h = `<div style="background:var(--blue); padding:5px; border:2px solid black; border-radius:10px; text-align:center; margin-top:15px; font-weight:bold; font-size:0.8rem;">${m.name}</div>`;
            h += `<div style="display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:0.5rem; font-weight:bold; margin:5px 0;">
                    <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
                  </div>`;
            h += `<div class="calendar-grid">`;

            const firstDay = new Date(m.year, m.monthIndex, 1).getDay();
            const daysInMonth = new Date(m.year, m.monthIndex + 1, 0).getDate();

            for (let x = 0; x < firstDay; x++) {
                h += `<div class="day" style="background:#f2f2f2; border-right:2px solid black; border-bottom:2px solid black;"></div>`;
            }

            for (let i = 1; i <= daysInMonth; i++) {
                let specialStyle = "";
                let weddingLabel = "";
                if (m.year === 2026 && m.monthIndex === 4 && i === 30) {
                    specialStyle = "background-color: var(--pink); border: 2px solid black;";
                    weddingLabel = "<br><span style='font-size:0.5rem; color:red;'>🇰🇷 WEDDING</span>";
                }
                if (m.year === 2026 && m.monthIndex === 8 && i === 26) {
                    specialStyle = "background-color: var(--yellow); border: 2px solid black;";
                    weddingLabel = "<br><span style='font-size:0.5rem; color:red;'>🇲🇾 WEDDING</span>";
                }

                h += `<div class="day" style="${specialStyle}" ondrop="drop(event)" ondragover="allowDrop(event)">
                        <strong>${i}</strong>${weddingLabel}
                      </div>`;
            }
            cont.innerHTML += h + `</div>`;
        });
    }

    function showPage(pId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        document.getElementById(pId + 'Page').classList.add('active-page');
        document.getElementById('backNav').style.display = pId==='home' ? 'none' : 'block';
        document.getElementById('mainHeader').style.display = pId==='home' ? 'block' : 'none';
    }

    function saveAllData() {
        const data = {
            calendar: document.getElementById('calendarContainer').innerHTML,
            money: document.getElementById('eList').innerHTML,
            guests: document.getElementById('guestDisplay').innerHTML,
            inspo: document.getElementById('inList').innerHTML,
            look: document.getElementById('loList').innerHTML,
            photos: document.getElementById('phList').innerHTML,
            vendors: document.getElementById('vList').innerHTML,
            creator: document.getElementById('cList').innerHTML
        };
        localStorage.setItem('jiasCastleData', JSON.stringify(data));
    }

    function loadAllData() {
        const saved = localStorage.getItem('jiasCastleData');
        if (saved) {
            const d = JSON.parse(saved);
            // Only overwrite calendar if it actually contains dropped pills
            if (d.calendar && d.calendar.includes('drop-')) {
                document.getElementById('calendarContainer').innerHTML = d.calendar;
            }
            document.getElementById('eList').innerHTML = d.money || "";
            document.getElementById('guestDisplay').innerHTML = d.guests || "";
            document.getElementById('inList').innerHTML = d.inspo || "";
            document.getElementById('loList').innerHTML = d.look || "";
            document.getElementById('phList').innerHTML = d.photos || "";
            document.getElementById('vList').innerHTML = d.vendors || "";
            document.getElementById('cList').innerHTML = d.creator || "";
            
            document.querySelectorAll('.pill, .item-card').forEach(el => {
                el.ondblclick = function() { this.remove(); saveAllData(); };
                if(el.classList.contains('pill')) el.ondragstart = drag;
            });
        }
    }

    function drag(e) { e.dataTransfer.setData("text", e.target.id); }
    function allowDrop(e) { e.preventDefault(); }
    function drop(e) {
        e.preventDefault();
        const id = e.dataTransfer.getData("text");
        const original = document.getElementById(id);
        if(!original) return;
        const node = original.cloneNode(true);
        node.id = "drop-" + Math.random();
        node.ondblclick = function() { this.remove(); saveAllData(); };
        e.currentTarget.appendChild(node);
        saveAllData();
    }

    function createNewPill() {
        const txt = document.getElementById('newPillText').value;
        if(!txt) return;
        const p = document.createElement('div');
        p.className = 'pill'; p.style.background = 'var(--cream)'; p.draggable = true;
        p.id = 'c-' + Date.now(); p.innerText = txt;
        p.ondragstart = drag; p.ondblclick = function() { this.remove(); saveAllData(); };
        document.getElementById('pillToolbox').prepend(p);
        document.getElementById('newPillText').value = "";
        saveAllData();
    }

    function addGuest() {
        const n = document.getElementById('gName').value, l = document.getElementById('gLoc').value;
        const extra = l==='Seoul' ? (document.getElementById('gBus').checked ? " (🚌 Bus)" : "") : " (🪑 Table: "+document.getElementById('gTable').value+")";
        document.getElementById('guestDisplay').innerHTML += `<div class="item-card" ondblclick="this.remove(); saveAllData();"><b>${n}</b> <span class="tag">${l}</span> ${extra}</div>`;
        saveAllData();
    }

    function addExpense() {
        const n = document.getElementById('eN').value, a = document.getElementById('eA').value;
        document.getElementById('eList').innerHTML += `<div class="item-card" ondblclick="this.remove(); saveAllData();"><b>${n}</b>: ${a}</div>`;
        saveAllData();
    }

    function saveMedia(p) {
        const u = document.getElementById(p+'U').value;
        document.getElementById(p+'List').innerHTML += `<div class="item-card" ondblclick="this.remove(); saveAllData();"><img src="${u}" style="width:100%"></div>`;
        saveAllData();
    }
</script>
</body>
</html>
