<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jia's Castle</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --pink: #FFD1DC; --yellow: #FFF9C4; --blue: #B3E5FC; --black: #000000; --white: #FFFFFF; --cream: #F5E6CC; }
        body { font-family: 'Inter', sans-serif; background: #fdfdfd; margin: 0; padding: 10px; display: flex; justify-content: center; }
        .app-container { max-width: 550px; width: 100%; background: var(--white); border: 4px solid var(--black); box-shadow: 10px 10px 0px var(--black); border-radius: 25px; padding: 20px; min-height: 95vh; }
        
        header { text-align: center; margin-bottom: 20px; }
        .dashboard-hero { width: 100%; max-width: 320px; margin: 0 auto 10px; display: block; }
        .back-btn { display: none; cursor: pointer; font-weight: bold; background: var(--yellow); padding: 8px 15px; border: 2px solid black; border-radius: 20px; margin-bottom: 15px; width: fit-content; }
        .page { display: none; }
        .active-page { display: block; }

        /* Dashboard */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .nav-card { background: white; border: 3px solid var(--black); border-radius: 20px; padding: 5px; cursor: pointer; transition: 0.2s; }
        .nav-card img { width: 100%; display: block; border-radius: 15px; }

        /* Calendar Styles */
        .toolbox { display: flex; flex-wrap: wrap; gap: 6px; background: #fafafa; padding: 12px; border: 3px solid black; border-radius: 15px; margin-bottom: 15px; position: sticky; top: 0; z-index: 100; box-shadow: 4px 4px 0px black; }
        .pill { padding: 4px 10px; border-radius: 15px; border: 2px solid black; font-weight: bold; font-size: 0.65rem; cursor: grab; background: white; }
        .calendar-header { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: bold; font-size: 0.7rem; margin-bottom: 5px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 2px solid black; border-left: 2px solid black; margin-bottom: 20px;}
        .day { min-height: 60px; border-right: 2px solid black; border-bottom: 2px solid black; padding: 4px; font-size: 0.65rem; }

        /* General UI */
        .input-box { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid black; border-radius: 12px; font-family: inherit; font-weight: bold; box-sizing: border-box; }
        .action-btn { background: var(--pink); cursor: pointer; font-weight: bold; border: 2px solid black; border-radius: 12px; transition: 0.2s; }
        .action-btn:hover { background: var(--yellow); }
        .item-card { background: #fff; border: 2px solid black; padding: 15px; border-radius: 15px; margin-bottom: 10px; }
        .tag { font-size: 0.65rem; padding: 2px 6px; border: 1px solid black; border-radius: 10px; margin-right: 4px; font-weight: bold; background: var(--yellow); }

        /* Table Map Specifics */
        .table-cluster { border: 2px dashed black; border-radius: 15px; padding: 10px; margin-top: 15px; background: #fafafa; }
        .table-title { font-weight: bold; text-decoration: underline; margin-bottom: 5px; display: block; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="backNav" class="back-btn" onclick="showPage('home')">← Dashboard</div>
    <header id="mainHeader"><img src="jia_locked_in_castle.png" class="dashboard-hero"></header>

    <div id="homePage" class="page active-page">
        <div class="dashboard-grid">
            <div class="nav-card" onclick="showPage('calendar')"><img src="icon-calender.png"></div>
            <div class="nav-card" onclick="showPage('guests')"><img src="icon-guest.png"></div>
            <div class="nav-card" onclick="showPage('inspo')"><img src="icon-inspo.png"></div>
            <div class="nav-card" onclick="showPage('look')"><img src="icon-thelook.png"></div>
            <div class="nav-card" onclick="showPage('vendors')"><img src="icon-vendors.png"></div>
            <div class="nav-card" onclick="showPage('creator')"><img src="icon-creator.png"></div>
            <div class="nav-card" onclick="showPage('money')"><img src="icon-money.png"></div>
            <div class="nav-card" onclick="showPage('photos')"><img src="icon-photos.png"></div>
        </div>
    </div>

    <div id="guestsPage" class="page">
        <h3>Add Guest</h3>
        <input type="text" id="gName" class="input-box" placeholder="Guest Name">
        <select id="gLoc" class="input-box">
            <option value="Seoul">Seoul Wedding</option>
            <option value="KL">KL Wedding</option>
        </select>
        <input type="text" id="gTable" class="input-box" placeholder="Table No./Name (e.g. Table 1)">
        <button class="input-box action-btn" onclick="addGuest()">Add to Map</button>
        
        <h3 style="margin-top: 30px;">KL Table Map</h3>
        <div id="tableMapContainer"></div>
    </div>

    <div id="calendarPage" class="page">
        <div class="toolbox">
            <div class="pill" style="background:var(--pink)" draggable="true" ondragstart="drag(event)" id="p1">💌 Invite</div>
            <div class="pill" style="background:var(--yellow)" draggable="true" ondragstart="drag(event)" id="p2">🍱 Taste</div>
            <div class="pill" style="background:var(--blue)" draggable="true" ondragstart="drag(event)" id="p3">💄 Makeup</div>
            <div class="pill" style="background:var(--pink)" draggable="true" ondragstart="drag(event)" id="p6">🎬 Film</div>
            <div class="pill" style="background:var(--pink)" draggable="true" ondragstart="drag(event)" id="p7">✂️ Edit</div>
        </div>
        <div id="calendarContainer" style="max-height: 60vh; overflow-y: auto;"></div>
    </div>

    <div id="moneyPage" class="page">
        <input type="text" id="mName" class="input-box" placeholder="Expense">
        <input type="number" id="mAmt" class="input-box" placeholder="Amount">
        <select id="mCur" class="input-box"><option value="KRW">₩ (Seoul)</option><option value="MYR">RM (KL)</option></select>
        <button class="input-box action-btn" onclick="addExpense()">Save Expense</button>
        <div id="moneyList"></div>
    </div>

    <div id="creatorPage" class="page">
        <textarea id="cNote" class="input-box" rows="2" placeholder="Video idea..."></textarea>
        <input type="text" id="cReel" class="input-box" placeholder="IG Reel URL">
        <button class="input-box action-btn" onclick="addCreatorItem()">Add Creator Item</button>
        <div id="creatorList" style="margin-top: 20px;"></div>
    </div>

    <div id="vendorsPage" class="page"><input type="text" id="vN" class="input-box" placeholder="Vendor"><button onclick="addV()" class="input-box action-btn">Add</button><div id="vList"></div></div>
    <div id="inspoPage" class="page"><input type="text" id="iU" class="input-box" placeholder="Link"><button onclick="addM('i')" class="input-box action-btn">Add</button><div id="iList"></div></div>
    <div id="lookPage" class="page"><input type="text" id="lU" class="input-box" placeholder="Link"><button onclick="addM('l')" class="input-box action-btn">Add</button><div id="lList"></div></div>
    <div id="photosPage" class="page"><input type="text" id="pU" class="input-box" placeholder="Link"><button onclick="addM('p')" class="input-box action-btn">Add</button><div id="pList"></div></div>
</div>

<script>
    function showPage(pId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        document.getElementById(pId + 'Page').classList.add('active-page');
        document.getElementById('backNav').style.display = pId==='home' ? 'none' : 'block';
        document.getElementById('mainHeader').style.display = pId==='home' ? 'block' : 'none';
    }

    // GUEST & TABLE LOGIC
    function addGuest() {
        const name = document.getElementById('gName').value;
        const loc = document.getElementById('gLoc').value;
        const tableName = document.getElementById('gTable').value || "Unassigned";
        if(!name) return;

        let tableDiv = document.getElementById('table-' + tableName.replace(/\s+/g, '-'));
        if(!tableDiv) {
            tableDiv = document.createElement('div');
            tableDiv.id = 'table-' + tableName.replace(/\s+/g, '-');
            tableDiv.className = 'table-cluster';
            tableDiv.innerHTML = `<span class="table-title">🪑 ${tableName}</span><ul id="list-${tableDiv.id}"></ul>`;
            document.getElementById('tableMapContainer').appendChild(tableDiv);
        }
        
        const li = document.createElement('li');
        li.innerHTML = `${name} <span class="tag">${loc}</span>`;
        document.getElementById('list-' + tableDiv.id).appendChild(li);
        document.getElementById('gName').value = "";
    }

    // CALENDAR GENERATION
    const months = ["December 2025", "January 2026", "February 2026", "March 2026", "April 2026", "May 2026", "June 2026", "July 2026", "August 2026", "September 2026", "October 2026"];
    months.forEach(m => {
        let h = `<div style="font-family:'Playfair Display'; background:var(--blue); padding:8px; border:2px solid black; border-radius:10px; text-align:center; margin-top:15px;">${m}</div>`;
        h += `<div class="calendar-header"><div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div></div>`;
        h += `<div class="calendar-grid">`;
        for(let i=1; i<=31; i++) h += `<div class="day" ondrop="drop(event)" ondragover="allowDrop(event)"><strong>${i}</strong></div>`;
        document.getElementById('calendarContainer').innerHTML += h + `</div>`;
    });

    function allowDrop(e) { e.preventDefault(); }
    function drag(e) { e.dataTransfer.setData("text", e.target.id); }
    function drop(e) {
        e.preventDefault();
        const node = document.getElementById(e.dataTransfer.getData("text")).cloneNode(true);
        node.ondblclick = function() { this.remove(); };
        e.currentTarget.appendChild(node);
    }

    // MONEY LOGIC
    function addExpense() {
        const n = document.getElementById('mName').value, a = document.getElementById('mAmt').value, c = document.getElementById('mCur').value;
        if(n && a) document.getElementById('moneyList').innerHTML += `<div class="item-card"><b>${n}</b>: ${c} ${parseFloat(a).toLocaleString()}</div>`;
    }

    // CREATOR LOGIC
    function addCreatorItem() {
        const n = document.getElementById('cNote').value, r = document.getElementById('cReel').value;
        let html = `<div class="item-card">`;
        if(n) html += `<p>${n}</p>`;
        if(r) html += `<iframe src="${r.split('?')[0]}embed/" width="100%" height="350" frameborder="0"></iframe>`;
        html += `</div>`;
        document.getElementById('creatorList').innerHTML = html + document.getElementById('creatorList').innerHTML;
    }

    // MISC
    function addV() { document.getElementById('vList').innerHTML += `<div class="item-card"><b>${document.getElementById('vN').value}</b></div>`; }
    function addM(p) { document.getElementById(p+'List').innerHTML += `<div class="item-card"><img src="${document.getElementById(p+'U').value}" style="width:100%"></div>`; }
</script>
</body>
</html>
