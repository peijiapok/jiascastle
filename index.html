<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jia's Castle</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --pink: #FFD1DC; --yellow: #FFF9C4; --blue: #B3E5FC; --black: #000000; --white: #FFFFFF; --cream: #F5E6CC; }
        body { font-family: 'Inter', sans-serif; background: #fdfdfd; margin: 0; padding: 10px; display: flex; justify-content: center; }
        .app-container { max-width: 550px; width: 100%; background: var(--white); border: 4px solid var(--black); box-shadow: 10px 10px 0px var(--black); border-radius: 25px; padding: 20px; min-height: 95vh; }
        
        header { text-align: center; margin-bottom: 20px; }
        .dashboard-hero { width: 100%; max-width: 320px; margin: 0 auto 10px; display: block; }
        .back-btn { display: none; cursor: pointer; font-weight: bold; background: var(--yellow); padding: 8px 15px; border: 3px solid black; border-radius: 20px; margin-bottom: 15px; width: fit-content; }
        .page { display: none; }
        .active-page { display: block; }

        /* Dashboard Grid */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .nav-card { background: white; border: 3px solid var(--black); border-radius: 20px; padding: 5px; cursor: pointer; transition: 0.2s; }
        .nav-card img { width: 100%; display: block; border-radius: 15px; }

        /* Calendar ToolBox */
        .toolbox { display: flex; flex-wrap: wrap; gap: 6px; background: #fafafa; padding: 12px; border: 3px solid black; border-radius: 15px; margin-bottom: 15px; position: sticky; top: 0; z-index: 100; box-shadow: 4px 4px 0px black; }
        .pill { padding: 4px 10px; border-radius: 15px; border: 2px solid black; font-weight: bold; font-size: 0.65rem; cursor: grab; background: white; white-space: nowrap; }
        .month-title { font-family: 'Playfair Display', serif; background: var(--blue); padding: 8px; border: 2px solid black; border-radius: 12px; text-align: center; margin-top: 20px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 2px solid black; border-left: 2px solid black; }
        .day { min-height: 75px; border-right: 2px solid black; border-bottom: 2px solid black; padding: 4px; font-size: 0.65rem; background: white; vertical-align: top; }
        .day .pill { display: block; margin-top: 3px; font-size: 0.55rem; cursor: pointer; text-align: center; padding: 1px; }

        /* General Inputs */
        .input-box { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid black; border-radius: 12px; font-family: inherit; font-weight: bold; box-sizing: border-box; }
        .action-btn { background: var(--pink); cursor: pointer; font-weight: bold; transition: 0.2s; }
        .action-btn:hover { background: var(--yellow); }
        .item-card { background: #fff; border: 2px solid black; padding: 15px; border-radius: 15px; margin-bottom: 10px; position: relative; }
        
        /* Media Grids */
        .media-list { display: grid; grid-template-columns: 1fr; gap: 15px; margin-top: 15px; }
        .media-item img { width: 100%; border: 2px solid black; border-radius: 10px; display: block; }
        .media-item iframe { width: 100%; height: 450px; border: 2px solid black; border-radius: 10px; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="backNav" class="back-btn" onclick="showPage('home')">← Dashboard</div>
    <header id="mainHeader"><img src="jia_locked_in_castle.png" class="dashboard-hero"></header>

    <div id="homePage" class="page active-page">
        <div class="dashboard-grid">
            <div class="nav-card" onclick="showPage('calendar')"><img src="icon-calender.png"></div>
            <div class="nav-card" onclick="showPage('guests')"><img src="icon-guest.png"></div>
            <div class="nav-card" onclick="showPage('inspo')"><img src="icon-inspo.png"></div>
            <div class="nav-card" onclick="showPage('look')"><img src="icon-thelook.png"></div>
            <div class="nav-card" onclick="showPage('vendors')"><img src="icon-vendors.png"></div>
            <div class="nav-card" onclick="showPage('creator')"><img src="icon-creator.png"></div>
            <div class="nav-card" onclick="showPage('money')"><img src="icon-money.png"></div>
            <div class="nav-card" onclick="showPage('photos')"><img src="icon-photos.png"></div>
        </div>
    </div>

    <div id="calendarPage" class="page">
        <div class="toolbox">
            <div class="pill" style="background:var(--pink)" draggable="true" ondragstart="drag(event)" id="p1">💌 Invitation Gathering</div>
            <div class="pill" style="background:var(--yellow)" draggable="true" ondragstart="drag(event)" id="p2">🍱 Taste Test</div>
            <div class="pill" style="background:var(--blue)" draggable="true" ondragstart="drag(event)" id="p3">💄 Makeup Trial</div>
            <div class="pill" style="background:var(--cream)" draggable="true" ondragstart="drag(event)" id="p4">💎 Shop Jewelry</div>
            <div class="pill" style="background:var(--cream)" draggable="true" ondragstart="drag(event)" id="p5">👠 Shop Shoes</div>
            <div class="pill" style="background:var(--pink)" draggable="true" ondragstart="drag(event)" id="p6">🎬 Film</div>
            <div class="pill" style="background:var(--pink)" draggable="true" ondragstart="drag(event)" id="p7">✂️ Edit</div>
            <div class="pill" style="background:var(--blue)" draggable="true" ondragstart="drag(event)" id="p8">👗 Gown Fitting</div>
        </div>
        <div id="calendarContainer" style="max-height: 60vh; overflow-y: auto;"></div>
    </div>

    <div id="creatorPage" class="page">
        <select id="cStatus" class="input-box">
            <option value="IDEA">💡 Pending Idea</option>
            <option value="FILMING">🎬 Currently Filming</option>
            <option value="EDITING">✂️ Editing</option>
        </select>
        <textarea id="cNote" class="input-box" rows="3" placeholder="Script idea or Reel link..."></textarea>
        <button class="input-box action-btn" onclick="addCreatorNote()">Add Creator Task</button>
        <div id="creatorList"></div>
    </div>

    <div id="inspoPage" class="page">
        <input type="text" id="inUrl" class="input-box" placeholder="Paste Image Link or Instagram URL">
        <button class="input-box action-btn" onclick="saveMedia('in')">Save to Inspo</button>
        <div id="inList" class="media-list"></div>
    </div>

    <div id="lookPage" class="page">
        <input type="text" id="loUrl" class="input-box" placeholder="Paste Gown/Makeup Link">
        <button class="input-box action-btn" onclick="saveMedia('lo')">Save to Lookbook</button>
        <div id="loList" class="media-list"></div>
    </div>

    <div id="photosPage" class="page">
        <input type="text" id="phUrl" class="input-box" placeholder="Paste Photo Link">
        <button class="input-box action-btn" onclick="saveMedia('ph')">Save to Gallery</button>
        <div id="phList" class="media-list"></div>
    </div>

    <div id="guestsPage" class="page"><h3>Guest Manager</h3><div id="guestList"></div></div>
    <div id="moneyPage" class="page"><h3>Budget</h3><div id="moneyList"></div></div>
    <div id="vendorsPage" class="page"><h3>Vendors</h3><div id="vendorList"></div></div>
</div>

<script>
    function showPage(pId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        document.getElementById(pId + 'Page').classList.add('active-page');
        document.getElementById('backNav').style.display = pId==='home' ? 'none' : 'block';
        document.getElementById('mainHeader').style.display = pId==='home' ? 'block' : 'none';
        window.scrollTo(0,0);
    }

    // CALENDAR GENERATION
    const months = ["December 2025", "January 2026", "February 2026", "March 2026", "April 2026", "May 2026", "June 2026", "July 2026", "August 2026", "September 2026", "October 2026"];
    months.forEach(m => {
        let h = `<div class="month-title">${m}</div><div class="calendar-grid">`;
        for(let i=1; i<=31; i++) h += `<div class="day" ondrop="drop(event)" ondragover="allowDrop(event)"><strong>${i}</strong></div>`;
        document.getElementById('calendarContainer').innerHTML += h + `</div>`;
    });

    function allowDrop(e) { e.preventDefault(); }
    function drag(e) { e.dataTransfer.setData("text", e.target.id); }
    function drop(e) {
        e.preventDefault();
        const data = e.dataTransfer.getData("text");
        const node = document.getElementById(data).cloneNode(true);
        node.ondblclick = function() { this.remove(); };
        e.currentTarget.appendChild(node);
    }

    // CREATOR LOGIC
    function addCreatorNote() {
        const s = document.getElementById('cStatus').value;
        const n = document.getElementById('cNote').value;
        if(!n) return;
        const card = `<div class="item-card"><b>[${s}]</b><br>${n}</div>`;
        document.getElementById('creatorList').innerHTML = card + document.getElementById('creatorList').innerHTML;
        document.getElementById('cNote').value = "";
    }

    // MEDIA SAVING LOGIC (For Inspo, Look, Photos)
    function saveMedia(prefix) {
        const url = document.getElementById(prefix + 'Url').value;
        if(!url) return;
        const container = document.getElementById(prefix + 'List');
        let content = '';

        if(url.includes('instagram.com')) {
            const cleanUrl = url.split('?')[0] + "embed/";
            content = `<div class="media-item"><iframe src="${cleanUrl}" frameborder="0"></iframe></div>`;
        } else {
            content = `<div class="media-item"><img src="${url}" onerror="this.src='https://via.placeholder.com/300?text=Link+Saved'"></div>`;
        }
        
        container.innerHTML = content + container.innerHTML;
        document.getElementById(prefix + 'Url').value = "";
    }
</script>

</body>
</html>
