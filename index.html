<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jia's Castle</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --pink: #FFD1DC; --yellow: #FFF9C4; --blue: #B3E5FC; --black: #000000; --white: #FFFFFF; --green: #C8E6C9; }
        body { font-family: 'Inter', sans-serif; background: #fdfdfd; margin: 0; padding: 10px; display: flex; justify-content: center; }
        .app-container { max-width: 550px; width: 100%; background: var(--white); border: 4px solid var(--black); box-shadow: 10px 10px 0px var(--black); border-radius: 25px; padding: 20px; min-height: 95vh; }
        
        header { text-align: center; margin-bottom: 20px; }
        .main-hero { width: 100%; max-width: 320px; margin: 0 auto 10px; display: block; border-radius: 15px; }
        .back-btn { display: none; cursor: pointer; font-weight: bold; background: var(--yellow); padding: 8px 15px; border: 3px solid black; border-radius: 20px; margin-bottom: 15px; width: fit-content; }
        .page { display: none; }
        .active-page { display: block; }

        /* Dashboard */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .nav-card { background: white; border: 3px solid var(--black); border-radius: 20px; padding: 5px; cursor: pointer; transition: 0.2s; }
        .nav-card img { width: 100%; display: block; border-radius: 15px; }

        /* Calendar */
        .toolbox { display: flex; flex-wrap: wrap; gap: 5px; background: #fafafa; padding: 12px; border: 3px solid black; border-radius: 15px; margin-bottom: 15px; position: sticky; top: 0; z-index: 100; box-shadow: 4px 4px 0px black; }
        .pill { padding: 4px 8px; border-radius: 10px; border: 2px solid black; font-weight: bold; font-size: 0.6rem; cursor: grab; background: white; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 2px solid black; border-left: 2px solid black; }
        .day { min-height: 70px; border-right: 2px solid black; border-bottom: 2px solid black; padding: 4px; font-size: 0.6rem; }
        .day .pill { display: block; margin-top: 2px; font-size: 0.5rem; text-align: center; }

        /* General UI */
        .input-box { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid black; border-radius: 12px; font-weight: bold; box-sizing: border-box; }
        .action-btn { background: var(--pink); cursor: pointer; font-weight: bold; border: 2px solid black; border-radius: 12px; padding: 12px; width: 100%; margin-top: 5px; }
        .item-card { background: #fff; border: 2px solid black; padding: 15px; border-radius: 15px; margin-bottom: 10px; position: relative; }
        .tag { font-size: 0.6rem; padding: 2px 6px; border: 1px solid black; border-radius: 8px; font-weight: bold; margin-right: 5px; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="backNav" class="back-btn" onclick="showPage('home')">← Dashboard</div>
    <header id="mainHeader"><img src="main-logo.png" class="main-hero"></header>

    <div id="homePage" class="page active-page">
        <div class="dashboard-grid">
            <div class="nav-card" onclick="showPage('calendar')"><img src="icon-calender.png"></div>
            <div class="nav-card" onclick="showPage('guests')"><img src="icon-guest.png"></div>
            <div class="nav-card" onclick="showPage('inspo')"><img src="icon-inspo.png"></div>
            <div class="nav-card" onclick="showPage('look')"><img src="icon-thelook.png"></div>
            <div class="nav-card" onclick="showPage('vendors')"><img src="icon-vendors.png"></div>
            <div class="nav-card" onclick="showPage('creator')"><img src="icon-creator.png"></div>
            <div class="nav-card" onclick="showPage('money')"><img src="icon-money.png"></div>
            <div class="nav-card" onclick="showPage('photos')"><img src="icon-photos.png"></div>
        </div>
    </div>

    <div id="calendarPage" class="page">
        <div class="toolbox">
            <div class="pill" style="background:var(--pink)" draggable="true" ondragstart="drag(event)" id="c1">💍 Registration</div>
            <div class="pill" style="background:var(--pink)" draggable="true" ondragstart="drag(event)" id="c2">💐 Bouquet</div>
            <div class="pill" style="background:var(--blue)" draggable="true" ondragstart="drag(event)" id="c3">🚢 Ship Decor</div>
            <div class="pill" style="background:var(--blue)" draggable="true" ondragstart="drag(event)" id="c4">🧲 Ship Magnets</div>
            <div class="pill" style="background:var(--yellow)" draggable="true" ondragstart="drag(event)" id="c5">📜 Vows</div>
            <div class="pill" style="background:var(--pink)" draggable="true" ondragstart="drag(event)" id="c6">📸 Pre-Wed</div>
            <div class="pill" style="background:var(--green)" draggable="true" ondragstart="drag(event)" id="c7">🥗 Diet</div>
            <div class="pill" style="background:var(--green)" draggable="true" ondragstart="drag(event)" id="c8">💆 Massage</div>
            <div class="pill" style="background:var(--yellow)" draggable="true" ondragstart="drag(event)" id="c9">✈️ Osaka Flight</div>
            <div class="pill" style="background:var(--yellow)" draggable="true" ondragstart="drag(event)" id="c10">🏨 Osaka Hotel</div>
            <div class="pill" style="background:var(--yellow)" draggable="true" ondragstart="drag(event)" id="c11">🇯🇵 Osaka Trip</div>
            <div class="pill" style="background:var(--blue)" draggable="true" ondragstart="drag(event)" id="c12">🏝️ Honeymoon</div>
        </div>
        <div id="calendarContainer" style="max-height: 60vh; overflow-y: auto;"></div>
    </div>

    <div id="moneyPage" class="page">
        <div class="item-card" style="background:var(--yellow)">
            <h3>Budget Master</h3>
            <input type="number" id="budgetInput" class="input-box" placeholder="Set Total Budget (e.g. 50000)" oninput="calcBudget()">
            <p><strong>Spent:</strong> <span id="totalSpent">0</span> | <strong>Balance:</strong> <span id="budgetBalance">0</span></p>
        </div>
        <input type="text" id="mName" class="input-box" placeholder="Expense Item">
        <input type="number" id="mAmt" class="input-box" placeholder="Amount">
        <button class="action-btn" onclick="addExpense()">Add Expense</button>
        <div id="moneyList" style="margin-top:15px;"></div>
    </div>

    <div id="creatorPage" class="page">
        <div class="item-card">
            <h3>🎬 New Production Task</h3>
            <input type="text" id="vTitle" class="input-box" placeholder="Video Title (e.g. Gown Fitting Vlog)">
            <select id="vStatus" class="input-box">
                <option value="FILMING">🎥 To Film</option>
                <option value="EDITING">✂️ To Edit</option>
                <option value="UPLOAD">🚀 To Upload</option>
            </select>
            <button class="action-btn" style="background:var(--blue)" onclick="addTask()">Add to Pipeline</button>
        </div>
        
        <div class="item-card">
            <h3>💡 Reel Inspiration</h3>
            <input type="text" id="vReel" class="input-box" placeholder="Paste IG Reel Link">
            <button class="action-btn" style="background:var(--pink)" onclick="addInspo()">Save Inspo</button>
        </div>
        
        <div id="creatorPipeline"></div>
    </div>

    <div id="guestsPage" class="page">
        <input type="text" id="gN" class="input-box" placeholder="Guest Name">
        <select id="gW" class="input-box"><option value="Seoul">Seoul</option><option value="KL">KL</option></select>
        <button class="action-btn" onclick="addG()">Add Guest</button>
        <div id="gList"></div>
    </div>
</div>

<script>
    function showPage(pId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        document.getElementById(pId + 'Page').classList.add('active-page');
        document.getElementById('backNav').style.display = pId==='home' ? 'none' : 'block';
        document.getElementById('mainHeader').style.display = pId==='home' ? 'block' : 'none';
    }

    // CALENDAR
    const months = ["December 2025", "January 2026", "February 2026", "March 2026", "April 2026", "May 2026", "June 2026", "July 2026", "August 2026", "September 2026", "October 2026"];
    months.forEach(m => {
        let h = `<div style="background:var(--blue); padding:5px; border:2px solid black; border-radius:10px; text-align:center; margin-top:15px; font-weight:bold; font-size:0.8rem;">${m}</div>`;
        h += `<div style="display:grid; grid-template-columns:repeat(7, 1fr); text-align:center; font-size:0.5rem; font-weight:bold; margin: 5px 0;"><div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div></div><div class="calendar-grid">`;
        for(let i=1; i<=31; i++) h += `<div class="day" ondrop="drop(event)" ondragover="allowDrop(event)"><strong>${i}</strong></div>`;
        document.getElementById('calendarContainer').innerHTML += h + `</div>`;
    });
    function allowDrop(e) { e.preventDefault(); }
    function drag(e) { e.dataTransfer.setData("text", e.target.id); }
    function drop(e) {
        e.preventDefault();
        const node = document.getElementById(e.dataTransfer.getData("text")).cloneNode(true);
        node.ondblclick = function() { this.remove(); };
        e.currentTarget.appendChild(node);
    }

    // MONEY & BUDGET
    let totalSpent = 0;
    function addExpense() {
        const n = document.getElementById('mName').value, a = parseFloat(document.getElementById('mAmt').value);
        if(!n || isNaN(a)) return;
        totalSpent += a;
        document.getElementById('moneyList').innerHTML += `<div class="item-card"><b>${n}</b>: ${a.toLocaleString()}</div>`;
        calcBudget();
    }
    function calcBudget() {
        const budget = parseFloat(document.getElementById('budgetInput').value) || 0;
        document.getElementById('totalSpent').innerText = totalSpent.toLocaleString();
        document.getElementById('budgetBalance').innerText = (budget - totalSpent).toLocaleString();
    }

    // CREATOR PIPELINE
    function addTask() {
        const t = document.getElementById('vTitle').value, s = document.getElementById('vStatus').value;
        if(!t) return;
        const color = s === 'FILMING' ? 'var(--yellow)' : (s === 'EDITING' ? 'var(--blue)' : 'var(--green)');
        document.getElementById('creatorPipeline').innerHTML += `<div class="item-card" style="border-left: 10px solid ${color}"><b>[${s}]</b> ${t}</div>`;
        document.getElementById('vTitle').value = "";
    }
    function addInspo() {
        const r = document.getElementById('vReel').value;
        if(!r) return;
        document.getElementById('creatorPipeline').innerHTML += `<div class="item-card"><iframe src="${r.split('?')[0]}embed/" width="100%" height="300" frameborder="0"></iframe></div>`;
    }
</script>
</body>
</html>
